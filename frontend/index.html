<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahlabahlasele 4.0 | Trading Dashboard</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --neon-blue: #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 1.5rem; color: var(--neon-blue); letter-spacing: 1px; }
        .status-badge { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid var(--accent-green); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

        .card { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; font-size: 0.9rem; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-primary { background-color: var(--neon-blue); color: #000; }
        .btn-success { background-color: var(--accent-green); color: #fff; }
        .btn-danger { background-color: var(--accent-red); color: #fff; }

        .metric-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .metric-value { font-weight: bold; color: var(--neon-blue); }
        
        .alert-box { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.85rem; display: none; text-align: center; }
        .alert-success { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid var(--accent-green); }
    </style>
</head>
<body>

    <div class="header">
        <h1>MAHLABAHLASELE 4.0</h1>
        <div id="systemStatus" class="status-badge">CONNECTING...</div>
    </div>

    <div class="grid">
        <!-- API CONFIGURATION -->
        <div class="card">
            <h2>API CONFIGURATION</h2>
            <div class="form-group">
                <label>Select Exchange</label>
                <select id="exchangeSelect">
                    <option value="binance">Binance</option>
                    <option value="bybit">Bybit</option>
                    <option value="kucoin">KuCoin</option>
                </select>
            </div>
            <div class="form-group">
                <label>Exchange API Key</label>
                <input type="password" id="apiKey" placeholder="Enter API Key">
            </div>
            <div class="form-group">
                <label>Secret Key</label
